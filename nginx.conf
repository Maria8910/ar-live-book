server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Main HTML page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NFT descriptor files — cache aggressively (immutable)
    location /nft/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Ensure correct MIME types (already set in mime.types, but be explicit)
        types {
            application/octet-stream fset fset3 iset;
        }
    }

    # Video files — range requests enabled by default in nginx
    location /videos/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # JS and CSS
    location /js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
